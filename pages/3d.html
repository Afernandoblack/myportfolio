<footer style="text-align:center; color:gray; padding:10px;">
  Last updated: <span id="lastUpdate">Loading...</span>
</footer>

<script>
  // Replace with your GitHub username and repo name
  const username = "Afernandoblack";
  const repo = "myportfolio";

  fetch(`https://api.github.com/repos/${username}/${repo}/commits?per_page=1`)
    .then(response => response.json())
    .then(data => {
      const date = new Date(data[0].commit.author.date);
      const formattedDate = date.toLocaleString("en-GB", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
      document.getElementById("lastUpdate").textContent = formattedDate;
    })
    .catch(error => {
      console.error('Error fetching last update:', error);
      document.getElementById("lastUpdate").textContent = "Unavailable";
    });
</script>
